<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monterra Invoices</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Invoices">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  /* Inter, saved with the app so it works offline. The second file holds the ₹ sign. */
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(vendor/inter-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(vendor/inter-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  /* Black and white only. Greys for anything secondary. */
  :root {
    --bg: #ffffff; --card: #ffffff; --ink: #000000; --ink-2: #262626; --muted: #666666; --faint: #9e9e9e;
    --line: #ebebeb; --line-strong: #d6d6d6; --fill: #f4f4f4;
    --accent: #000000; --accent-soft: #f4f4f4;
    --warn: #000000; --warn-soft: #f4f4f4; --bad: #000000; --bad-soft: #f4f4f4; --ok: #000000; --ok-soft: #f4f4f4;
    --serif: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --r: 16px; --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  body { padding: calc(var(--top) + 6px) 0 calc(var(--bottom) + 92px); min-height: 100vh; }
  body.locked { overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .serif { font-family: var(--serif); }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }
  .ico { width: 20px; height: 20px; flex: none; }
  .ico-s { width: 16px; height: 16px; flex: none; }

  /* page header */
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 4px; color: var(--ink); text-transform: uppercase; padding-top: 14px; }
  .title { font-family: var(--serif); font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin: 2px 0 14px; }
  .section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 4px 8px; }
  .section-h h2 { font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .section-h .aside { font-size: 13px; color: var(--muted); }

  /* hero summary */
  .hero { background: var(--ink); color: #fff; border-radius: 20px; padding: 18px 18px 16px; }
  .hero .lbl { font-size: 13px; color: rgba(255,255,255,.7); }
  .hero .big { font-family: var(--serif); font-size: 30px; font-weight: 700; letter-spacing: -1px; margin: 2px 0 14px; }
  .hero .row2 { display: flex; gap: 10px; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 600; font-size: 16px; background: var(--ink); color: #fff; width: 100%; transition: transform .12s var(--ease), opacity .15s, background-color .15s; }
  .btn:active { transform: scale(.98); }
  .btn.light { background: #fff; color: var(--ink); }
  .btn.accent { background: var(--ink); }
  .btn.glass { background: rgba(255,255,255,.12); color: #fff; }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); }
  .btn.accent { background: var(--accent); }
  .btn.danger { background: transparent; color: var(--bad); }
  .btn.text { background: transparent; color: var(--accent); width: auto; min-height: 44px; padding: 0 8px; }
  .btn:disabled { opacity: .45; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 14px; background: var(--ink); color: #fff; white-space: nowrap; transition: transform .12s var(--ease); }
  .pill:active { transform: scale(.96); }
  .pill.warn { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pill.wait { background: var(--fill); color: var(--muted); }
  .pill.paid { background: var(--ink); color: #fff; }
  .pill.unpaid { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--muted); }
  .tag.warn { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.ok { background: var(--fill); color: var(--ink-2); }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* grouped lists */
  .group { background: var(--card); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
  .cell { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 60px; width: 100%; text-align: left; position: relative; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  button.cell:active, .cell.tap:active { background: #f7f7f7; }
  .cell .main { flex: 1; min-width: 0; }
  .cell .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .t2 { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .chev { color: var(--faint); }
  .avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .5px; flex: none; }

  /* order cards */
  .order { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 14px 16px; display: flex; gap: 12px; align-items: center; transition: opacity .25s, transform .25s var(--ease); }
  .order + .order { margin-top: 10px; }
  .order .main { flex: 1; min-width: 0; text-align: left; }
  .order .t1 { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order .t2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .order .money { font-family: var(--serif); font-weight: 600; font-size: 19px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .order .note { margin-top: 6px; }
  .order.gone { opacity: 0; transform: translateX(40px); }

  /* forms */
  .field { padding: 10px 16px 12px; position: relative; }
  .field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .field input, .field select, .field textarea { width: 100%; border: 0; background: transparent; font-size: 16px; padding: 2px 0; min-height: 30px; outline: none; }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
  .input { width: 100%; border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; padding: 10px 12px; min-height: 46px; font-size: 16px; }
  textarea.input { min-height: 180px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; resize: vertical; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 12px; padding: 0 12px; min-height: 42px; color: var(--muted); }
  .search input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; color: var(--ink); min-height: 40px; }
  .seg { display: flex; background: var(--fill); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; min-height: 36px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-strong); font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* item rows in the editor */
  .item { padding: 14px 16px; position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .item .pick { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; }
  .item .pick .nm { flex: 1; font-weight: 600; line-height: 1.3; }
  .item .pick .nm.missing { color: var(--bad); }
  .item .said { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .item .ctrl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .stepper { display: flex; align-items: center; background: var(--fill); border-radius: 12px; }
  .stepper button { width: 40px; height: 40px; font-size: 20px; color: var(--ink); display: grid; place-items: center; }
  .stepper input { width: 52px; text-align: center; border: 0; background: transparent; font-weight: 600; font-size: 16px; outline: none; }
  .price { display: flex; align-items: center; gap: 2px; background: var(--fill); border-radius: 12px; padding: 0 10px; height: 40px; color: var(--muted); }
  .price input { width: 64px; border: 0; background: transparent; font-weight: 600; font-size: 16px; outline: none; color: var(--ink); }
  .item .lt { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .item .rm { width: 36px; height: 40px; color: var(--faint); display: grid; place-items: center; }
  .tot { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 16px; font-variant-numeric: tabular-nums; }
  .tot .l { color: var(--muted); }
  .tot .v { text-align: right; }
  .tot .gl { font-weight: 700; padding-top: 8px; border-top: 1px solid var(--line); }
  .tot .gv { font-family: var(--serif); font-weight: 600; font-size: 22px; text-align: right; padding-top: 4px; border-top: 1px solid var(--line); color: var(--accent); }

  /* banners */
  .banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .banner.warn { background: var(--fill); color: var(--ink); }
  .banner.bad { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .banner ul { padding-left: 16px; font-size: 14px; }
  .banner b { display: block; margin-bottom: 2px; }
  .raw-msg { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--ink-2); padding: 12px 16px 14px; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  /* tab bar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.88); -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px); border-top: 1px solid var(--line); display: flex; padding-bottom: var(--bottom); z-index: 10; }
  nav.tabs button { flex: 1; padding: 8px 0 6px; font-size: 11px; font-weight: 600; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; min-height: 52px; }
  nav.tabs button svg { width: 25px; height: 25px; }
  nav.tabs button.on { color: var(--ink); }
  nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; padding: 0 5px; line-height: 18px; }

  /* sheets */
  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: calc(var(--bottom) + 110px); }
  .sheet.top { z-index: 30; }
  .sheet.anim { animation: up .28s var(--ease); }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .navbar { position: sticky; top: 0; z-index: 3; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding-top: var(--top); border-bottom: 1px solid var(--line); }
  .navbar .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; min-height: 52px; padding: 0 8px; }
  .navbar .ttl { flex: 1; text-align: center; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .navbar .side { min-width: 84px; display: flex; }
  .navbar .side.r { justify-content: flex-end; }
  .navbar .btn.text { font-weight: 600; }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 10px 0 calc(var(--bottom) + 10px); z-index: 25; }
  .sheet.top .actions { z-index: 35; }
  .actions .wrap { display: flex; gap: 10px; }
  .preview { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
  .preview .scaler { transform-origin: top left; width: 800px; }
  .stack > * + * { margin-top: 12px; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: calc(var(--bottom) + 92px); transform: translate(-50%, 8px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 10px 10px 16px; border-radius: 14px; font-size: 14px; z-index: 60; width: max-content; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; transition: opacity .2s, transform .2s var(--ease); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #fff; text-decoration: underline; font-weight: 700; padding: 6px 8px; }
  .toast .msg { padding: 4px 6px 4px 0; }

  .tick { width: 24px; height: 24px; accent-color: var(--ink); flex: none; margin-top: 2px; }
  .empty { text-align: center; padding: 36px 20px; color: var(--muted); }
  .empty svg { width: 40px; height: 40px; color: var(--faint); margin-bottom: 8px; }
  #pdf-stage { position: fixed; left: -10000px; top: 0; width: 800px; background: #fff; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- invoice (same look as the invoices already sent) ---------- */
  .inv { font-feature-settings: normal; font-variant-numeric: normal; font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #fff; color: #1a1a1a; padding: 40px 32px; font-size: 11px; line-height: 1.45; width: 800px; }
  .inv * { margin: 0; padding: 0; box-sizing: border-box; }
  .inv .header { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; margin-bottom: 32px; padding-bottom: 18px; border-bottom: 2px solid #1a1a2e; }
  .inv .brand-mark .name { font-size: 26px; font-weight: 700; color: #1a1a2e; letter-spacing: 5px; line-height: 1; }
  .inv .brand-mark .sub { font-size: 10px; font-weight: 600; color: #6b7280; letter-spacing: 7px; margin-top: 4px; }
  .inv .brand-mark .tagline { font-size: 9px; color: #6b7280; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; }
  .inv .meta { text-align: right; }
  .inv .meta h1 { font-size: 28px; font-weight: 700; color: #1a1a2e; letter-spacing: 1px; }
  .inv .meta .invoice-no, .inv .meta .date { font-size: 10.5px; color: #6b7280; }
  .inv .meta .invoice-no { margin-top: 4px; }
  .inv .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 28px; }
  .inv .party h3 { font-size: 9px; color: #6b7280; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin: 0 0 6px; }
  .inv .party .name { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 4px; }
  .inv .party .addr { font-size: 10.5px; color: #4b5563; line-height: 1.6; }
  .inv table.items { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  .inv table.items thead tr { background: #1a1a2e; }
  .inv table.items thead th { background: #1a1a2e; border: 0; color: #fff; padding: 10px 12px; font-size: 9.5px; font-weight: 700; text-align: left; text-transform: uppercase; letter-spacing: 0.4px; }
  .inv table.items th.right, .inv table.items td.right { text-align: right; }
  .inv table.items th.center, .inv table.items td.center { text-align: center; }
  .inv table.items tbody td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 11px; color: #1f2937; vertical-align: top; }
  .inv table.items tbody td.right { font-variant-numeric: normal; }
  .inv table.items tbody td.product { font-weight: 600; color: #111827; }
  .inv table.items tbody td.product .desc { display: block; color: #9ca3af; font-weight: 400; font-size: 9.5px; margin-top: 2px; }
  .inv .totals { display: grid; grid-template-columns: 1fr auto; margin-top: 8px; }
  .inv .totals table { border-collapse: collapse; }
  .inv .totals td { padding: 6px 14px; font-size: 11px; }
  .inv .totals td.label { text-align: right; color: #6b7280; }
  .inv .totals td.value { text-align: right; font-weight: 600; color: #1f2937; min-width: 100px; }
  .inv .totals tr.grand td { border-top: 2px solid #1a1a2e; padding-top: 10px; font-size: 14px; font-weight: 700; color: #1a1a2e; }
  .inv .totals tr.grand td.value { color: #92400e; }
  .inv .terms { margin-top: 32px; padding: 16px 18px; background: #f9fafb; border-left: 3px solid #1a1a2e; border-radius: 4px; }
  .inv .terms h3 { font-size: 9px; color: #6b7280; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin: 0 0 8px; }
  .inv .terms p { font-size: 10.5px; color: #4b5563; line-height: 1.6; margin: 4px 0; }
  .inv .footer { margin-top: 32px; padding-top: 14px; border-top: 1px solid #e5e7eb; text-align: center; font-size: 9.5px; color: #9ca3af; }
  .inv .footer p { margin: 3px 0; }
  .inv .footer strong { color: #6b7280; }
</style>
</head>

  <div id="app"></div>
  <div id="pdf-stage" aria-hidden="true"></div>
  <script src="vendor/html2canvas.min.js"></script>

  <script src="vendor/qrcode.min.js"></script>
  <script src="seed.private.js" onerror="void 0"></script>
  <script src="data.js"></script>

  <script src="app.js"></script>

</html>
